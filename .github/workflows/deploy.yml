name: Deploy to GitHub Pages + CloudBase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Avoid concurrent deploys racing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (Vite, output to ./dist)
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Upload dist artifact (for CloudBase step)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout sources (for cloudbaserc.json)
        if: ${{ secrets.CLOUDBASE_ENV_ID != '' }}
        uses: actions/checkout@v4

      - name: Download dist artifact
        if: ${{ secrets.CLOUDBASE_ENV_ID != '' }}
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist

      - name: Deploy to CloudBase (skip until secrets are set)
        if: ${{ secrets.CLOUDBASE_ENV_ID != '' }}
        uses: TencentCloudBase/cloudbase-action@v2
        with:
          secretId: ${{ secrets.CLOUDBASE_SECRET_ID }}
          secretKey: ${{ secrets.CLOUDBASE_SECRET_KEY }}
          envId: ${{ secrets.CLOUDBASE_ENV_ID }}
        env:
          ENV_ID: ${{ secrets.CLOUDBASE_ENV_ID }}
